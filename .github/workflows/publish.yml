name: Publish

run-name: Publish ${{ github.ref_name }}

on:
  push:
    tags: [ '[0-9]+.[0-9]+.[0-9]+' ]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Read Flutter version
        id: flutter-version
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: dart-lang/setup-dart@v1

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - name: Publish to pub.dev
        run: |
          if curl -sf "https://pub.dev/api/packages/double_feature/versions/${GITHUB_REF_NAME}" > /dev/null; then
            echo "${GITHUB_REF_NAME} is already on pub.dev"
          else
            make install
            flutter pub publish --force
          fi
